# This is the Github action to build and push the OpenCV CUDA Docker image used for static builds.
#
name: OpenCV CUDA Static

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HAS_DOCKERHUB: ${{ github.repository == 'hybridgroup/gocv' }}
  DOCKERHUB_NAMESPACE: gocv
  OPENCV_VERSION: 5.0.0

jobs:
  opencv:
    name: opencv-amd64
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.opencv-gpu-cuda-12-static
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/opencv:${{ env.OPENCV_VERSION }}-gpu-cuda-12-static-amd64
            ${{ github.repository == 'hybridgroup/gocv' && 'gocv/opencv:5.0.0-gpu-cuda-12-static-amd64' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  manifest:
    name: publish-manifest
    needs: opencv
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GHCR manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository_owner }}/opencv:${{ env.OPENCV_VERSION }}-gpu-cuda-12-static \
            ghcr.io/${{ github.repository_owner }}/opencv:${{ env.OPENCV_VERSION }}-gpu-cuda-12-static-amd64

      - name: Create Docker Hub manifest
        if: env.HAS_DOCKERHUB == 'true'
        run: |
          docker buildx imagetools create \
            -t gocv/opencv:${{ env.OPENCV_VERSION }}-gpu-cuda-12-static \
            gocv/opencv:${{ env.OPENCV_VERSION }}-gpu-cuda-12-static-amd64
