name: Windows

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - dev
      - release

# Note:  See files win_download_opencv.cmd and  win_build_opencv.cmd
# in the project root directory for configuring the opencv version
# and build parameters

env:
  # OpenCV Windows library suffix for 5.0.0, e.g. opencv_core500.
  # If the Windows build emits a different suffix, update this value.
  OPENCV_LIB_SUFFIX: 500

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: true
      - name: Restore cached OpenCV source
        uses: actions/cache/restore@v4
        id: cache-opencv-source
        with:
          key: opencv-source-5000-windows-v4
          path: |
            ./opencv/opencv-5.0.0
            ./opencv/opencv_contrib-5.0.0
      - name: Download OpenCV source
        if: steps.cache-opencv-source.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          call .\win_download_opencv.cmd "%GITHUB_WORKSPACE%\opencv"
      # NOTE: apply patch to openCV 5.0.0 to fix build issues reported here
      # https://github.com/opencv/opencv/pull/29352/
      # This patch should be removed for Opencv 5.1.x
      - name: Patch OpenCV MLAS MinGW build
        shell: pwsh
        run: |
          cd "${env:GITHUB_WORKSPACE}\opencv\opencv-5.0.0"
      
          git apply --check "${env:GITHUB_WORKSPACE}\patches\opencv-5.0.0-mlas-mingw.patch"
          git apply "${env:GITHUB_WORKSPACE}\patches\opencv-5.0.0-mlas-mingw.patch"
      
          Write-Host "Checking patched MLAS allocation code..."
          Select-String -Path "3rdparty\mlas\lib\mlasi.h" -Pattern "aligned_alloc|posix_memalign|__APPLE__|ThreadedBufAlignment" -Context 3,3
      
          $patched = Select-String `
            -Path "3rdparty\mlas\lib\mlasi.h" `
            -Pattern "#elif \(__STDC_VERSION__ >= 201112L\) && !defined\(__APPLE__\)" `
            -Quiet
      
          if (!$patched) {
            throw "MLAS MinGW patch was not applied"
          }
      - name: Save cached OpenCV source
        uses: actions/cache/save@v4
        if: steps.cache-opencv-source.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.cache-opencv-source.outputs.cache-primary-key }}
          path: |
            ./opencv/opencv-5.0.0
            ./opencv/opencv_contrib-5.0.0
      - name: Restore cached OpenCV build
        uses: actions/cache/restore@v4
        id: cache-opencv-build
        with:
          key: opencv-build-5000-windows-v4
          path: |
            ./opencv/build
      - name: Build OpenCV
        if: steps.cache-opencv-build.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          call .\win_build_opencv.cmd "%GITHUB_WORKSPACE%\opencv"
      - name: Save cached OpenCV build
        uses: actions/cache/save@v4
        if: steps.cache-opencv-build.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.cache-opencv-build.outputs.cache-primary-key }}
          path: |
            ./opencv/build
      - name: Inspect OpenCV libraries
        shell: pwsh
        run: |
            Get-ChildItem "${env:GITHUB_WORKSPACE}\opencv\build\install\x64\mingw\lib" -Filter "opencv_core*.dll.a" | Select-Object -ExpandProperty Name
            Get-ChildItem "${env:GITHUB_WORKSPACE}\opencv\build\install\x64\mingw\lib" -Filter "opencv_*.dll.a" | Select-Object -First 50 -ExpandProperty Name
      - name: Set GoCV env
        run: |
            go env
            echo "CGO_CXXFLAGS=--std=c++17 -DNDEBUG" >> $env:GITHUB_ENV
            echo "CGO_CPPFLAGS=-I${env:GITHUB_WORKSPACE}\opencv\build\install\include" >> $env:GITHUB_ENV
            echo "CGO_LDFLAGS=-L${env:GITHUB_WORKSPACE}\opencv\build\install\x64\mingw\lib -lopencv_core${env:OPENCV_LIB_SUFFIX} -lopencv_face${env:OPENCV_LIB_SUFFIX} -lopencv_videoio${env:OPENCV_LIB_SUFFIX} -lopencv_imgproc${env:OPENCV_LIB_SUFFIX} -lopencv_highgui${env:OPENCV_LIB_SUFFIX} -lopencv_imgcodecs${env:OPENCV_LIB_SUFFIX} -lopencv_objdetect${env:OPENCV_LIB_SUFFIX} -lopencv_features2d${env:OPENCV_LIB_SUFFIX} -lopencv_video${env:OPENCV_LIB_SUFFIX} -lopencv_dnn${env:OPENCV_LIB_SUFFIX} -lopencv_xfeatures2d${env:OPENCV_LIB_SUFFIX} -lopencv_plot${env:OPENCV_LIB_SUFFIX} -lopencv_tracking${env:OPENCV_LIB_SUFFIX} -lopencv_img_hash${env:OPENCV_LIB_SUFFIX} -lopencv_calib3d${env:OPENCV_LIB_SUFFIX} -lopencv_bgsegm${env:OPENCV_LIB_SUFFIX} -lopencv_photo${env:OPENCV_LIB_SUFFIX} -lopencv_aruco${env:OPENCV_LIB_SUFFIX} -lopencv_wechat_qrcode${env:OPENCV_LIB_SUFFIX} -lopencv_ximgproc${env:OPENCV_LIB_SUFFIX} -lopencv_xphoto${env:OPENCV_LIB_SUFFIX} -lopencv_xobjdetect${env:OPENCV_LIB_SUFFIX}" >> $env:GITHUB_ENV
            echo "${env:GITHUB_WORKSPACE}/opencv/build/install/x64/mingw/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Tensorflow test model
        run: |
            mkdir -p ./testdata
            curl -sL https://storage.googleapis.com/download.tensorflow.org/models/inception5h.zip > ./testdata/inception5h.zip
            unzip -o ./testdata/inception5h.zip tensorflow_inception_graph.pb -d ./testdata
      - name: Install ONNX test model
        run: |
          curl -sL https://huggingface.co/onnxmodelzoo/legacy_models/resolve/main/validated/vision/classification/inception_and_googlenet/googlenet/model/googlenet-9.onnx > ./testdata/googlenet-9.onnx
          curl -sL https://huggingface.co/opencv/face_recognition_sface/resolve/main/face_recognition_sface_2021dec.onnx > ./testdata/face_recognition_sface_2021dec.onnx
          curl -sL https://huggingface.co/opencv/face_detection_yunet/resolve/main/face_detection_yunet_2023mar.onnx > ./testdata/face_detection_yunet_2023mar.onnx
          curl -sL https://huggingface.co/opencv/object_tracking_vittrack/resolve/main/object_tracking_vittrack_2023sep.onnx > ./testdata/object_tracking_vittrack_2023sep.onnx
      - name: Set GoCV model env
        run: |
            go env
            echo "GOCV_TENSORFLOW_TEST_FILES=${env:GITHUB_WORKSPACE}\testdata" >> $env:GITHUB_ENV
            echo "GOCV_ONNX_TEST_FILES=${env:GITHUB_WORKSPACE}\testdata" >> $env:GITHUB_ENV
      - name: Test GoCV
        run: |
            go test -v -tags="matprofile,customenv" .
      - name: Test GoCV Contrib
        run: |
            go test -v -tags="matprofile,customenv" ./contrib
