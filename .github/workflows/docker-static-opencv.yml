# This is the Github action to build and push the OpenCV Docker images used for static builds.
#
name: OpenCV
on:
  push:
    branches: [alpine-static-improved-2]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HAS_DOCKERHUB: ${{ github.repository == 'hybridgroup/gocv' }}
  DOCKERHUB_NAMESPACE: gocv
  OPENCV_VERSION: 5.0.0
  IMAGE_VARIANT: alpine-ffmpeg-gstreamer

jobs:
  opencv:
    name: opencv-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/opencv:${{ env.OPENCV_VERSION }}-${{ env.IMAGE_VARIANT }}
          tags: |
            type=sha,format=long

      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Log in to Github Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: image-tags
        run: |
          {
            echo "tags<<EOF"
            if [ "$HAS_DOCKERHUB" = "true" ]; then
              echo "${DOCKERHUB_NAMESPACE}/opencv:${OPENCV_VERSION}-${IMAGE_VARIANT}-${{ matrix.arch }}"
              echo "${DOCKERHUB_NAMESPACE}/opencv:sha-${GITHUB_SHA}-${IMAGE_VARIANT}-${{ matrix.arch }}"
            fi
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/opencv:${OPENCV_VERSION}-${IMAGE_VARIANT}-${{ matrix.arch }}"
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/opencv:sha-${GITHUB_SHA}-${IMAGE_VARIANT}-${{ matrix.arch }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile.opencv-static-alpine
          platforms: ${{ matrix.platform }}
          context: .
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  manifest:
    name: opencv-manifest
    needs: opencv
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Log in to Github Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GHCR manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${GITHUB_REPOSITORY_OWNER}/opencv:${OPENCV_VERSION}-${IMAGE_VARIANT} \
            ghcr.io/${GITHUB_REPOSITORY_OWNER}/opencv:${OPENCV_VERSION}-${IMAGE_VARIANT}-amd64 \
            ghcr.io/${GITHUB_REPOSITORY_OWNER}/opencv:${OPENCV_VERSION}-${IMAGE_VARIANT}-arm64

          docker buildx imagetools create \
            -t ghcr.io/${GITHUB_REPOSITORY_OWNER}/opencv:sha-${GITHUB_SHA}-${IMAGE_VARIANT} \
            ghcr.io/${GITHUB_REPOSITORY_OWNER}/opencv:sha-${GITHUB_SHA}-${IMAGE_VARIANT}-amd64 \
            ghcr.io/${GITHUB_REPOSITORY_OWNER}/opencv:sha-${GITHUB_SHA}-${IMAGE_VARIANT}-arm64

      - name: Create Docker Hub manifest
        if: env.HAS_DOCKERHUB == 'true'
        run: |
          docker buildx imagetools create \
            -t ${DOCKERHUB_NAMESPACE}/opencv:${OPENCV_VERSION}-${IMAGE_VARIANT} \
            ${DOCKERHUB_NAMESPACE}/opencv:${OPENCV_VERSION}-${IMAGE_VARIANT}-amd64 \
            ${DOCKERHUB_NAMESPACE}/opencv:${OPENCV_VERSION}-${IMAGE_VARIANT}-arm64

          docker buildx imagetools create \
            -t ${DOCKERHUB_NAMESPACE}/opencv:sha-${GITHUB_SHA}-${IMAGE_VARIANT} \
            ${DOCKERHUB_NAMESPACE}/opencv:sha-${GITHUB_SHA}-${IMAGE_VARIANT}-amd64 \
            ${DOCKERHUB_NAMESPACE}/opencv:sha-${GITHUB_SHA}-${IMAGE_VARIANT}-arm64
