            -t ${DOCKERHUB_NAMESPACE}/opencv:${OPENCV_VERSION}-alpine \
            ${DOCKERHUB_NAMESPACE}/opencv:${OPENCV_VERSION}-alpine-amd64 \
            ${DOCKERHUB_NAMESPACE}/opencv:${OPENCV_VERSION}-alpine-arm64

  opencv-ffmpeg:
    name: opencv-ffmpeg (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [gstreamer-manifest, ffmpeg-manifest]
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check disk space
        run: df . -h
      - name: Free disk space
        run: |
          sudo docker rmi $(docker image ls -aq) >/dev/null 2>&1 || true
          sudo rm -rf \
            /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
            /usr/lib/jvm || true
          echo "extra directories deleted"
          sudo apt install aptitude -y >/dev/null 2>&1
          sudo aptitude purge aria2 ansible azure-cli shellcheck rpm xorriso zsync \
            esl-erlang firefox gfortran-8 gfortran-9 google-chrome-stable \
            google-cloud-sdk imagemagick \
            libmagickcore-dev libmagickwand-dev libmagic-dev ant ant-optional kubectl \
            mercurial apt-transport-https mono-complete libmysqlclient \
            unixodbc-dev yarn chrpath libssl-dev libxft-dev \
            libfreetype6 libfreetype6-dev libfontconfig1 libfontconfig1-dev \
            snmp pollinate libpq-dev postgresql-client powershell ruby-full \
            sphinxsearch subversion mongodb-org azure-cli microsoft-edge-stable \
            -y -f >/dev/null 2>&1
          sudo aptitude purge google-cloud-sdk -f -y >/dev/null 2>&1
          sudo aptitude purge microsoft-edge-stable -f -y >/dev/null 2>&1 || true
          sudo apt purge microsoft-edge-stable -f -y >/dev/null 2>&1 || true
          sudo aptitude purge '~n ^mysql' -f -y >/dev/null 2>&1
          sudo aptitude purge '~n ^php' -f -y >/dev/null 2>&1
          sudo aptitude purge '~n ^dotnet' -f -y >/dev/null 2>&1
          sudo apt-get autoremove -y >/dev/null 2>&1
          sudo apt-get autoclean -y >/dev/null 2>&1
          echo "extra packages purged"
      - name: Check disk space
        run: df . -h
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Check out the repo
        uses: actions/checkout@v6
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/opencv
          tags: |
            type=sha,format=long
            type=raw,value=latest
      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Log in to Github Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image tags
        id: image-tags
        run: |
          {
            echo "tags<<EOF"
            if [ "$HAS_DOCKERHUB" = "true" ]; then
              echo "${DOCKERHUB_NAMESPACE}/opencv:${OPENCV_VERSION}-alpine-ffmpeg-${{ matrix.arch }}"
              echo "${DOCKERHUB_NAMESPACE}/opencv:sha-${GITHUB_SHA}-alpine-ffmpeg-${{ matrix.arch }}"
            fi
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/opencv:${OPENCV_VERSION}-alpine-ffmpeg-${{ matrix.arch }}"
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/opencv:sha-${GITHUB_SHA}-alpine-ffmpeg-${{ matrix.arch }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push arch image
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile.opencv-static-alpine-ffmpeg
          platforms: ${{ matrix.platform }}
          context: .
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=opencv-ffmpeg-${{ matrix.arch }}-${{ env.OPENCV_VERSION }}-alpine
          cache-to: type=gha,mode=max,scope=opencv-ffmpeg-${{ matrix.arch }}-${{ env.OPENCV_VERSION }}-alpine

  opencv-ffmpeg-manifest:
    name: opencv-ffmpeg manifest
    runs-on: ubuntu-24.04
    needs: opencv-ffmpeg
    permissions:
      packages: write
      contents: read
    steps:
      - name: Set up Docker Buildx
