# This is the Github action to build and push OpenCV Docker images.
#
name: Docker
on:
  push:
    branches: [build-opencv-images]
  workflow_dispatch:

env:
  # Set OpenCV version here to be used by all image tags.
  OPENCV_VERSION: 5.0.0

  # Docker Hub publishing policy.
  #
  # Upstream repository:
  #   hybridgroup/gocv always publishes Docker Hub images using the existing
  #   gocv/opencv:<tag> namespace and its configured Docker Hub secrets.
  #
  # Forks:
  #   Docker Hub publishing is disabled by default, so forks can build and push
  #   GHCR images without needing Docker Hub credentials. A fork can still opt in
  #   by adding both repository secrets:
  #     DOCKER_HUB_USERNAME
  #     DOCKER_HUB_ACCESS_TOKEN
  #
  #   When a fork opts in, Docker Hub images are published using the Docker Hub
  #   username from DOCKER_HUB_USERNAME, for example:
  #     <DOCKER_HUB_USERNAME>/opencv:<tag>
  #
  # GHCR images are always published using github.repository_owner:
  #   ghcr.io/<owner>/opencv:<tag>
  IS_UPSTREAM_REPOSITORY: ${{ github.repository_owner == 'hybridgroup' }}
  HAS_DOCKERHUB: ${{ github.repository_owner == 'hybridgroup' || (secrets.DOCKER_HUB_USERNAME != '' && secrets.DOCKER_HUB_ACCESS_TOKEN != '') }}
  DOCKERHUB_NAMESPACE: ${{ github.repository_owner == 'hybridgroup' && 'gocv' || secrets.DOCKER_HUB_USERNAME }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opencv:
    name: opencv
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check disk space
        run: df . -h
      - name: Free disk space
        run: |
          sudo docker rmi $(docker image ls -aq) >/dev/null 2>&1 || true
          sudo rm -rf \
            /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
            /usr/lib/jvm || true
          echo "extra directories deleted"
          sudo apt install aptitude -y >/dev/null 2>&1
          sudo aptitude purge aria2 ansible azure-cli shellcheck rpm xorriso zsync \
            esl-erlang firefox gfortran-8 gfortran-9 google-chrome-stable \
            google-cloud-sdk imagemagick \
            libmagickcore-dev libmagickwand-dev libmagic-dev ant ant-optional kubectl \
            mercurial apt-transport-https mono-complete libmysqlclient \
            unixodbc-dev yarn chrpath libssl-dev libxft-dev \
            libfreetype6 libfreetype6-dev libfontconfig1 libfontconfig1-dev \
            snmp pollinate libpq-dev postgresql-client powershell ruby-full \
            sphinxsearch subversion mongodb-org azure-cli microsoft-edge-stable \
            -y -f >/dev/null 2>&1
          sudo aptitude purge google-cloud-sdk -f -y >/dev/null 2>&1
          sudo aptitude purge microsoft-edge-stable -f -y >/dev/null 2>&1 || true
          sudo apt purge microsoft-edge-stable -f -y >/dev/null 2>&1 || true
          sudo aptitude purge '~n ^mysql' -f -y >/dev/null 2>&1
          sudo aptitude purge '~n ^php' -f -y >/dev/null 2>&1
          sudo aptitude purge '~n ^dotnet' -f -y >/dev/null 2>&1
          sudo apt-get autoremove -y >/dev/null 2>&1
          sudo apt-get autoclean -y >/dev/null 2>&1
          echo "extra packages purged"
      - name: Check disk space
        run: df . -h
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:latest
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Check out the repo
        uses: actions/checkout@v6
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/opencv:${{ env.OPENCV_VERSION }}
          tags: |
            type=sha,format=long
            type=raw,value=latest
      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Log in to Github Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image tags
        id: image-tags
        run: |
          {
            echo "tags<<EOF"
            if [ "$HAS_DOCKERHUB" = "true" ]; then
              echo "${DOCKERHUB_NAMESPACE}/opencv:latest"
              echo "${DOCKERHUB_NAMESPACE}/opencv:${OPENCV_VERSION}"
            fi
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/opencv:latest"
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/opencv:${OPENCV_VERSION}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile.opencv
          platforms: linux/amd64,linux/arm64
          context: .
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

